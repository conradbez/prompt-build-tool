[project]
name = "pbt-extra-model-kinds"
version = "0.1.0"
description = "Extra pbt model kinds: python_modal, agent_modal and agent37."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-build-tool>=0.5.10",
    "modal>=1.0",
    "httpx>=0.27",
]

[project.entry-points."pbt.model_kinds"]
python_modal = "pbt_extra_model_kinds.modal_exec"
agent_modal = "pbt_extra_model_kinds.agent_exec"
agent37 = "pbt_extra_model_kinds.agent37_exec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
