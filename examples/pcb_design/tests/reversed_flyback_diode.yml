# Saved evidence from a reversed SS34 flyback diode.
# Logical pins and DRC pass, but physical pad 1 (cathode) is on MOTOR_DRAIN.
# The rest of the pipeline runs for real; only the two models that carry the
# fault are pinned: `parts` (the library's pin map) and `board` (the copper).
baselines:
  default:
    promptdata:
      brief: >-
        ESP32 board switching a 12 V, 500 mA motor with an AO3400A low-side
        MOSFET and an SS34 flyback diode, plus an IR beam-break on 3V3.

    given:
      parts:
        parts:
          - ref: D1
            function: motor flyback diode
            wanted_value: SS34 Schottky, 3 A, 40 V
            lcsc: C8678
            value: SS34 SMA
            tier: Basic
            why: common Basic Schottky
            polarised: true
            # The library's view: cathode on pin 2. This is the bug.
            pins:
              - {pin: "1", name: anode, net: MOTOR_DRAIN}
              - {pin: "2", name: cathode, net: 12V}
            mismatch: null
          - ref: Q2
            function: motor low-side switch
            wanted_value: AO3400A N-MOSFET, logic level
            lcsc: C20917
            value: AO3400A SOT-23
            tier: Basic
            why: Rds(on) rated at 2.5 V gate
            polarised: true
            pins:
              - {pin: "1", name: gate, net: motor_gate}
              - {pin: "2", name: source, net: GND}
              - {pin: "3", name: drain, net: MOTOR_DRAIN}
            mismatch: null

      # Only the fields downstream models read.
      board:
        output: &reversed_output
          ato_build: pass
          bom:
            - {ref: D1, lcsc: C8678, value: SS34, footprint: SMA}
            - {ref: Q2, lcsc: C20917, value: AO3400A, footprint: SOT-23}
          # What the copper actually does: band (pad 1) on the drain.
          pad_nets:
            - {ref: D1, pads: [{pad: "1", net: MOTOR_DRAIN}, {pad: "2", net: 12V}]}
            - {ref: Q2, pads: [{pad: "1", net: motor_gate}, {pad: "2", net: GND}, {pad: "3", net: MOTOR_DRAIN}]}
          drc: {errors: 0, unconnected: 0, warnings: 5}
          files:
            ato: elec/src/board.ato
            board: elec/layout/default/default.kicad_pcb
            placement_script: layout_board.py

cases:
  - name: Reversed flyback diode
    expect:
      polarity:
        - {ref: D1, built_pads_agree: false}
        - {ref: Q2, built_pads_agree: true}

  - name: Corrected flyback diode
    given:
      board:
        output:
          <<: *reversed_output
          pad_nets:
            - {ref: D1, pads: [{pad: "1", net: 12V}, {pad: "2", net: MOTOR_DRAIN}]}
            - {ref: Q2, pads: [{pad: "1", net: motor_gate}, {pad: "2", net: GND}, {pad: "3", net: MOTOR_DRAIN}]}
    expect:
      polarity:
        - {ref: D1, built_pads_agree: true}
        - {ref: Q2, built_pads_agree: true}
